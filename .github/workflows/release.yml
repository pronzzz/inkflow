# Builds and publishes a release when a version tag (v2.0.1, …) is pushed, or on demand.
# If the release already exists with files (for example published from a Mac with
# scripts/release.sh --publish), the workflow leaves it alone.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skip if already published
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          assets=$(gh release view "v$version" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
          echo "published=$([ "$assets" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v') && steps.existing.outputs.published == 'false'
        run: |
          version=$(awk -F'"' '/MARKETING_VERSION/ {print $2; exit}' project.yml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - uses: maxim-lobanov/setup-xcode@v1
        if: steps.existing.outputs.published == 'false'
        with:
          xcode-version: latest-stable
      - name: Install tools
        if: steps.existing.outputs.published == 'false'
        run: brew install xcodegen create-dmg
      - name: Build and publish
        if: steps.existing.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --publish
