name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Check the committed project is up to date
        run: |
          xcodegen generate --quiet
          git diff --exit-code -- Inkflow.xcodeproj || { echo "Run xcodegen generate and commit Inkflow.xcodeproj"; exit 1; }
      - name: Build and test
        run: xcodebuild -project Inkflow.xcodeproj -scheme Inkflow -derivedDataPath build/ci test
